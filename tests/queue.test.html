<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testes da fila idempotente</title>
<style>body{max-width:820px;margin:32px auto;padding:0 18px;font:16px system-ui;color:#16382f;background:#f4f7f2}main{padding:24px;border:1px solid #dce8dd;border-radius:16px;background:white}#summary{padding:12px;background:#edf4ee;font-weight:700}li{padding:6px 0}.pass{color:#08734d}.fail{color:#b42318}</style></head>
<body><main><h1>Testes da fila idempotente</h1><p id="summary" role="status">Executando…</p><ol id="results"></ol></main>
<script>
(async function(){
 const summary=document.getElementById('summary'),results=document.getElementById('results'),outcomes=[];
 const assert=(condition,message)=>{if(!condition)throw new Error(message||'Condição não atendida.')};
 async function test(name,callback){try{await callback();outcomes.push({name,passed:true})}catch(error){outcomes.push({name:name+' — '+error.message,passed:false})}}
 function extract(source,name,asyncFunction=false){const marker=(asyncFunction?'async function ':'function ')+name+'(';const start=source.indexOf(marker);if(start<0)throw new Error('Não encontrei '+name+'.');const lineEnd=source.indexOf('\n',start),firstLine=source.slice(start,lineEnd);if(firstLine.endsWith('}'))return firstLine;const lineStart=source.lastIndexOf('\n',start)+1,indentation=source.slice(lineStart,start).match(/^\s*/)[0],closing='\n'+indentation+'}',end=source.indexOf(closing,start);if(end<0)throw new Error('Não encontrei o fim de '+name+'.');return source.slice(start,end+closing.length)}
 function uuidSource(source){const match=source.match(/function gerarIdempotencyKey\(\)\{[^\n]+/);if(!match)throw new Error('Não encontrei gerarIdempotencyKey().');return match[0]}
 function createHarness(source){
  const declarations=[uuidSource(source),extract(source,'offlineQueue'),extract(source,'enfileirarOffline'),extract(source,'agendarRetryOffline'),extract(source,'conflitoDuplicadoDaFila',true),extract(source,'sincronizarOffline',true),extract(source,'supabaseWrite',true),extract(source,'supabaseRpcWrite',true),extract(source,'applyStockBalance',true)].join('\n');
  let serial=0;
  const state={crypto:{randomUUID:()=> '00000000-0000-4000-8000-'+String(++serial).padStart(12,'0')},localStorage:{data:new Map(),getItem(k){return this.data.get(k)||null},setItem(k,v){this.data.set(k,String(v))},removeItem(k){this.data.delete(k)}},navigator:{onLine:true},OFFLINE_QUEUE_KEY:'queue',OFFLINE_STATE_KEY:'state',usuarioAdminAutorizado:true,SUPABASE_URL:'https://supabase.test',SUPABASE_KEY:'key',supabaseHeaders:{apikey:'key','Content-Type':'application/json','Prefer':'return=minimal'},sessaoDeEscrita:async()=>({user:{id:'admin-id',email:'admin@example.test'},access_token:'token'}),salvarEstadoOffline(){},atualizarStatusOffline(){},recarregarEstoque:async()=>{},carregarHistoricosSupabase:async()=>{},window:{refreshOverviewMovements(){}},setTimeout:()=>1,console:{warn(){}}};
  const factory=new Function('deps','with(deps){let offlineRetryTimer=null,sincronizandoOffline=false,offlineSyncError="";'+declarations+';return{gerarIdempotencyKey,offlineQueue,enfileirarOffline,conflitoDuplicadoDaFila,sincronizarOffline,supabaseWrite,supabaseRpcWrite,applyStockBalance};}');
  return{api:factory(state),state};
 }
 try{
  const loaded=await fetch('../index.html',{cache:'no-store'});if(!loaded.ok)throw new Error('Falha ao abrir ../index.html.');const source=await loaded.text();
  let h=createHarness(source),api=h.api,state=h.state;
  await test('Gera UUID v4',async()=>assert(/^\w{8}-\w{4}-4\w{3}-8\w{3}-\w{12}$/.test(api.gerarIdempotencyKey())));
  await test('Enfileirar chave repetida não duplica',async()=>{const key='00000000-0000-4000-8000-000000000099',options={method:'POST',body:'{}',headers:{}};api.enfileirarOffline('rpc/ef_alterar_saldo',options,'admin-id',key);api.enfileirarOffline('rpc/ef_alterar_saldo',options,'admin-id',key);assert(api.offlineQueue().length===1,'A fila contém cópias duplicadas.');assert(api.offlineQueue()[0].idempotencyKey===key,'A chave original não foi preservada.')});
  h=createHarness(source);api=h.api;state=h.state;
  await test('Resposta perdida online é reenviada sem duplicar',async()=>{let effects=0,first=true,saldo=0;state.fetch=async(url,options)=>{const p=JSON.parse(options.body);if(!saldo){saldo=10+p.p_quantidade;effects++}if(first){first=false;throw new TypeError('Failed to fetch após commit')}return{ok:true,status:200,json:async()=>saldo}};const result=await api.applyStockBalance({id:2,qtd:10},'entrada',3,'NF 1');assert(state.navigator.onLine&&result.queued,'Falha de rede online não foi enfileirada.');const op=api.offlineQueue()[0],p=JSON.parse(op.options.body);assert(op.idempotencyKey===p.p_idempotency_key,'A chave da fila diverge do payload.');await api.sincronizarOffline();assert(effects===1,'A operação foi aplicada mais de uma vez.');assert(api.offlineQueue().length===0,'Resposta 200 não removeu a operação.')});
  h=createHarness(source);api=h.api;state=h.state;
  await test('POST do histórico inclui idempotency_key e usuário do JWT',async()=>{let sent;state.fetch=async(url,options)=>{sent=JSON.parse(options.body);return{ok:true,status:201,text:async()=>''}};const key='00000000-0000-4000-8000-000000000111';await api.supabaseWrite('historico_entradas',{method:'POST',body:JSON.stringify({produto:'TESTE'}),headers:{}},key);assert(sent.idempotency_key===key,'Chave não incluída no body.');assert(sent.usuario==='admin@example.test','Usuário do JWT não aplicado.')});
  h=createHarness(source);api=h.api;state=h.state;
  await test('23505 no índice de histórico é idempotente',async()=>{const op={path:'historico_entradas',options:{method:'POST',body:JSON.stringify({idempotency_key:'k'})}};assert(await api.conflitoDuplicadoDaFila(op,{code:'23505',constraint:'idx_historico_entradas_idempotency'},{}));assert(await api.conflitoDuplicadoDaFila(op,{code:'23505',message:'duplicate key violates unique constraint "idx_historico_entradas_idempotency"'},{}));assert(!await api.conflitoDuplicadoDaFila(op,{code:'23505',constraint:'historico_entradas_pkey'},{}))});
  await test('23505 de estoque exige linha correspondente',async()=>{const body={id:5,produto:'PRODUTO',empresa:'EMPRESA',lote:'L1',pilha:'P1',qtd:8,unid:'KG',validade:'2027-01-01',armazem:1};const op={path:'estoque',options:{method:'POST',body:JSON.stringify(body)}};state.fetch=async()=>({ok:true,json:async()=>[body]});assert(await api.conflitoDuplicadoDaFila(op,{code:'23505'},{}),'Linha igual rejeitada.');state.fetch=async()=>({ok:true,json:async()=>[{...body,qtd:9}]});assert(!await api.conflitoDuplicadoDaFila(op,{code:'23505'},{}),'Linha diferente aceita.')});
  await test('23505 de observação NF exige conteúdo correspondente',async()=>{const body={referencia:'NF 123',observacao:'NOTA IGUAL'},op={path:'ef_observacoes_nf',options:{method:'POST',body:JSON.stringify(body)}};state.fetch=async()=>({ok:true,json:async()=>[body]});assert(await api.conflitoDuplicadoDaFila(op,{code:'23505'},{}),'Observação igual rejeitada.');state.fetch=async()=>({ok:true,json:async()=>[{referencia:'NF 123',observacao:'OUTRO TEXTO'}]});assert(!await api.conflitoDuplicadoDaFila(op,{code:'23505'},{}),'Observação diferente aceita.')});
  await test('Erro HTTP de negócio não entra na fila',async()=>{let calls=0;state.fetch=async()=>{calls++;return{ok:false,status:400,text:async()=>'saldo esperado diverge'}};let failed=false;try{await api.supabaseRpcWrite('ef_confirmar_baixa_manual',{p_id:1,p_quantidade:1})}catch{failed=true}assert(failed,'Erro de negócio não propagado.');assert(api.offlineQueue().length===0,'Erro de negócio entrou na fila.');assert(calls===1,'RPC chamada mais de uma vez.')});
  await test('ef_confirmar_baixa_manual envia p_idempotency_key',async()=>{let sent;state.fetch=async(url,options)=>{sent=JSON.parse(options.body);return{ok:true,status:200,json:async()=>7}};const result=await api.supabaseRpcWrite('ef_confirmar_baixa_manual',{p_id:1,p_quantidade:2});assert(sent.p_idempotency_key===result.idempotencyKey,'Chave não chegou à RPC.');assert(result.data===7,'Saldo retornado não interpretado.')});
 }catch(error){outcomes.push({name:'Execução: '+error.message,passed:false})}
 const failed=outcomes.filter(item=>!item.passed).length;summary.textContent=failed?String(outcomes.length-failed)+' de '+outcomes.length+' testes passaram; '+failed+' falharam.':'✅ '+outcomes.length+' testes passaram.';
 outcomes.forEach(item=>{const row=document.createElement('li');row.className=item.passed?'pass':'fail';row.textContent=(item.passed?'✅ ':'❌ ')+item.name;results.appendChild(row)});
})();
</script></body></html>
