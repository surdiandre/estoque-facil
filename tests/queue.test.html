   const raw={v:3,seq_saida:'S-FLUXO',nr_nf:'NF-FLUXO',itens:[{codigo:'1161',produto:'NOME DIVERGENTE NO QR',lote:'0076-25-5779',quantidade:1234}]};

   const item=parsed.items[0],pile=document.getElementById('qr-item-pilha-0');
   assert(item.selectedProduct==='PERITO 10 KG'&&item.matchSource==='código','O código do catálogo não teve prioridade sobre o nome do QR.');
   assert(item.candidates.join(',')==='5','A pilha não foi filtrada por produto e lote.');
   assert(pile&&pile.value==='5','A pilha compatível não foi selecionada.');
   let sentToCarga=null;
   window.usuarioAdminAutorizado=true;
   window.addQrOrderItemsToCarga=info=>{sentToCarga=info;return true};
   window.addQrItemsToCarga();
   assert(sentToCarga?.items.length===1,'O item não chegou ao modal.');
   const sent=sentToCarga.items[0];
   assert(sent.qtd===1234&&sent.lote==='0076-25-5779','A quantidade do QR ou lote mudou no envio ao modal.');
   assert(sent.unid==='PCT','A unidade não veio do registro da pilha escolhida no estoque.');
  });
  await test('QR v3 — rejeita campo unid antigo',async()=>{
   expectQrError({v:3,seq_saida:'S1',nr_nf:'N1',itens:[{codigo:'1',produto:'P',lote:'L1',quantidade:4,unid:'pct'}]},'campo não permitido no item: unid');
  });
  await test('QR v3 — C: 4.000 e 3.000 não viram total 7.000',async()=>{
   const peritos=parseQr(qr74522).items.filter(item=>item.codigo==='1161');
   assert(peritos.length===2,'As quantidades foram agrupadas em uma linha.');
   assert(peritos[0].quantidade===4000&&peritos[1].quantidade===3000,'Quantidade por lote alterada.');
   assert(!peritos.some(item=>item.quantidade===7000),'Foi criado um total incorreto de 7.000.');
  });
  await test('QR v3 — D: preserva zeros à esquerda e hífens do lote',async()=>{
   const raw={v:3,seq_saida:'75709',nr_nf:'74522',itens:[{codigo:'1161',produto:'PERITO 10 KG',lote:'0076-25-5779',quantidade:4000}]};
   const parsed=parseQr(raw);
   assert(parsed.items[0].lote==='0076-25-5779','O lote deixou de ser exatamente 0076-25-5779.');
   assert(typeof parsed.items[0].lote==='string','O lote não permaneceu string.');
  });
  await test('QR v3 — E: rejeita quantidade decimal',async()=>{
   expectQrError({v:3,seq_saida:'S1',nr_nf:'N1',itens:[{codigo:'1',produto:'P',lote:'L1',quantidade:4.5}]},'quantidade inválida');
  });
  await test('QR v3 — F: rejeita quantidade string com separador de milhar',async()=>{
   expectQrError({v:3,seq_saida:'S1',nr_nf:'N1',itens:[{codigo:'1',produto:'P',lote:'L1',quantidade:'4.000'}]},'quantidade inválida');
  });
  await test('QR v3 — G: rejeita lote numérico',async()=>{
   expectQrError({v:3,seq_saida:'S1',nr_nf:'N1',itens:[{codigo:'1',produto:'P',lote:76255779,quantidade:4}]},'lote precisa ser string');
  });
  await test('QR v3 — H: rejeita QR malformado e descarta v1',async()=>{
   expectQrError({v:3,seq_saida:'S1',itens:[{codigo:'1',produto:'P',lote:'L1',quantidade:4}]},'formato inválido');
   expectQrError({tipo:'EF-BAIXA',v:1,nf:'N1',seq_saida:'S1',itens:[{codigo:'1',produto:'P',lote:'L1',qtd:4}]},'formato inválido');
  });
  await test('QR v3 — I: rejeita QR sem itens',async()=>{
   expectQrError({v:3,seq_saida:'S1',nr_nf:'N1',itens:[]},'QR sem itens');
  });
  await test('QR v3 — valida 12.000 caracteres e limite rígido de 50 itens',async()=>{
   const one={codigo:'1',produto:'P',lote:'L1',quantidade:1};
   const fifty={v:3,seq_saida:'S1',nr_nf:'N1',itens:Array.from({length:50},()=>({...one}))};
   assert(parseQr(fifty).items.length===50,'Não aceitou exatamente 50 itens.');
   expectQrError({...fifty,itens:Array.from({length:51},()=>({...one}))},'50 itens');
   const oversized=JSON.stringify({v:3,seq_saida:'S1',nr_nf:'N1',itens:[{...one,produto:'X'.repeat(12000)}]});
   expectQrError(oversized,'12.000 caracteres');
  });
  await test('QR v3 — fallback por nome e lote e aviso de escolha manual',async()=>{
   const byNameLot=parseQr({v:3,seq_saida:'S2',nr_nf:'N2',itens:[{codigo:'9999',produto:'PERITO 10 KG',lote:'0076-25-5779',quantidade:1}]}).items[0];
   assert(byNameLot.selectedProduct==='PERITO 10 KG'&&byNameLot.matchSource==='nome e lote','O fallback por nome e lote falhou.');
   const unmatched=parseQr({v:3,seq_saida:'S3',nr_nf:'N3',itens:[{codigo:'9998',produto:'PRODUTO DESCONHECIDO',lote:'SEM-LOTE',quantidade:1}]}).items[0];
   assert(unmatched.warning.toLowerCase().includes('escolha manualmente'),'Item sem correspondência não mostra aviso para escolha manual.');
   assert(unmatched.productOptions.includes('PERITO 10 KG'),'Não foram oferecidas opções do catálogo ao operador.');
  });
  await test('QR v3 — J: os 19 testes anteriores continuam passando',async()=>{
   const previous=outcomes.slice(0,19);
   assert(previous.length===19,'A quantidade de testes anteriores mudou; encontrados '+previous.length+'.');
   assert(previous.every(item=>item.passed),'Um ou mais dos 19 testes anteriores falharam.');
  });
 }catch(error){outcomes.push({name:'Execução: '+error.message,passed:false})}
 const failed=outcomes.filter(item=>!item.passed).length;summary.textContent=failed?String(outcomes.length-failed)+' de '+outcomes.length+' testes passaram; '+failed+' falharam.':'✅ '+outcomes.length+' testes passaram.';
 outcomes.forEach(item=>{const row=document.createElement('li');row.className=item.passed?'pass':'fail';row.textContent=(item.passed?'✅ ':'❌ ')+item.name;results.appendChild(row)});
})();
